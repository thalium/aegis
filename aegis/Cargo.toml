[package]
name = "aegis"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "aegis"
test = true
bench = false

[dependencies]
bootloader = { version = "0.9", features = ["map_physical_memory"] }
volatile = "0.2.6"
lazy_static = { version = "1.0", features = ["spin_no_std"] }
spin = "0.5.2"
x86_64 = "0.14.2"
uart_16550 = "0.4.0"
pic8259 = "0.10.1"
pc-keyboard = "0.7.0"
linked_list_allocator = "0.9.0"
paste = "1.0.15"
raw-cpuid = "11.6.0"
libaegis = { path = "../libaegis", features = [] }

[package.metadata.bootimage]
run-args = [
    "-enable-kvm",
    "-cpu",
    "qemu64,kvm=on,+xsave,+avx,+avx512f,+avx512bw,+avx512dq,+avx512vl",
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "unix:/tmp/serial.sock,server,nowait",
    "-device",
    "ivshmem-plain,memdev=ivmem",
    "-object",
    "memory-backend-file,id=ivmem,share=on,mem-path=/dev/shm/ivshmem,size=16M",
]

test-args = [
    "-device",
    "isa-debug-exit,iobase=0xf4,iosize=0x04",
    "-serial",
    "stdio",
    "-display",
    "none",
]
test-success-exit-code = 33
test-timeout = 300

[[test]]
name = "should_panic"
harness = false


[[test]]
name = "stack_overflow"
harness = false
